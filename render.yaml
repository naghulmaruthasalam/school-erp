# Backend on Render (Docker, includes Chromium for PDF export). Create it with: Render > New > Blueprint.
services:
  - type: web
    name: school-erp-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cogniitec-ai-school-local
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-project.vercel.app
      - key: BACKEND_BASE_URL
        sync: false          # this service's public URL, e.g. https://school-erp-api.onrender.com
      - key: FRONTEND_BASE_URL
        sync: false          # the Vercel URL
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
